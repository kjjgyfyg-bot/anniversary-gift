<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>A gift from Engineer Zainab</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #fff5f7, #ffd1dc);
            color: #5d001e;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        /* شاشة الباسورد */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff5f7; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: #fff; padding: 30px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;
            border: 1px solid #ffb6c1; width: 320px; max-width: 90%;
        }
        .auth-box h2 { margin-bottom: 15px; color: #d63384; font-size: 20px; }
        .auth-box input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #ffb6c1; text-align: center;
            font-size: 16px; margin-bottom: 15px; outline: none;
        }
        .auth-box button {
            background: #ff69b4; color: white; border: none;
            padding: 10px 20px; border-radius: 10px; font-size: 16px;
            cursor: pointer; width: 100%; font-weight: bold;
        }

        /* المحتوى الرئيسي */
        #main-content {
            display: none; max-width: 600px; width: 100%;
            text-align: center; z-index: 10; position: relative;
        }
        h1 { color: #d63384; margin-bottom: 15px; font-size: 28px; }

        /* العداد الزمني */
        .counter-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px; padding: 20px; margin: 20px 0;
            border: 1px solid #ffb6c1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .counter-title { font-size: 15px; color: #d63384; margin-bottom: 12px; font-weight: bold; }
        .counter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .time-box {
            background: #ff69b4; padding: 12px;
            border-radius: 12px; color: white;
        }
        .time-box span { display: block; font-size: 22px; font-weight: bold; }
        .time-box label { font-size: 13px; }

        /* بيت الشعر */
        .poetry-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px; border-radius: 20px;
            border: 2px solid #ffb6c1; margin: 20px 0;
            line-height: 2; font-size: 17px; color: #5d001e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* ألبوم الصور (7 صور) */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .gallery img {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid #fff;
        }
        /* جعل الصورة الأخيرة تأخذ العرض كاملاً لشكل أرتب */
        .gallery img:nth-child(7) {
            grid-column: span 2;
        }

        /* القلوب المتحركة في الخلفية */
        .floating-heart {
            position: absolute; color: rgba(255, 105, 180, 0.5);
            font-size: 20px; user-select: none; pointer-events: none;
            animation: floatUp 4s linear infinite; z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- شاشة الباسورد -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>أدخل كلمة المرور للوصول ❤️</h2>
            <input type="password" id="pass-input" placeholder="كلمة المرور">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <!-- محتوى الموقع -->
    <div id="main-content">
        <h1>لحظاتنا الجميلة</h1>

        <!-- العداد الزمني -->
        <div class="counter-container">
            <div class="counter-title">معاً منذ 18 سبتمبر 2025 وحتى اللحظة:</div>
            <div class="counter-grid">
                <div class="time-box">
                    <span id="days-count">0</span>
                    <label>يوماً</label>
                </div>
                <div class="time-box">
                    <span id="hours-count">0</span>
                    <label>ساعة</label>
                </div>
            </div>
        </div>

        <!-- بيت الشعر -->
        <div class="poetry-box">
            يا ساكناً في القلبِ لا يمحوهُ البعدُ والزمنُ<br>
            أنتَ الحياةُ التي في طيفِها أُفتتنُ<br>
            حُبك كالنورِ في روحي وفي مُهجتي<br>
            أنتَ الذي بكلِ نبضٍ في دمي تسكنُ.
        </div>

        <!-- ألبوم الصور (7 صور) -->
        <div class="gallery">
            <img src="رابط_صورة_1" alt="ذكريات">
            <img src="رابط_صورة_2" alt="ذكريات">
            <img src="رابط_صورة_3" alt="ذكريات">
            <img src="رابط_صورة_4" alt="ذكريات">
            <img src="رابط_صورة_5" alt="ذكريات">
            <img src="رابط_صورة_6" alt="ذكريات">
            <img src="رابط_صورة_7" alt="ذكريات">
        </div>
    </div>

    <!-- الأغنية -->
    <audio id="bg-music" loop>
        <source src="https://github.com/kjjgyfyg-bot/anniversary-gift/raw/refs/heads/main/%D8%B3%D8%B1%D9%83%20%D8%A7%D9%8A%D9%87.mp3" type="audio/mp3">
    </audio>

    <script>
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            if (pass === '1892025') {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('bg-music').play().catch(() => {});
                startCounter();
                startHearts();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        // العداد الزمني التلقائي
        function startCounter() {
            const startDate = new Date('2025-09-18T00:00:00');
            function update() {
                const now = new Date();
                const diff = now - startDate;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('days-count').innerText = days >= 0 ? days : 0;
                document.getElementById('hours-count').innerText = hours >= 0 ? hours : 0;
            }
            update();
            setInterval(update, 1000 * 60);
        }

        // القلوب المتحركة
        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 6000);
            }, 400);
        }
    </script>
</body>
</html>
