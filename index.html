<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محمود ونضوه وليال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #fff5f7, #ffd1dc);
            color: #5d001e;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff5f7; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: #fff; padding: 30px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;
            border: 1px solid #ffb6c1; width: 320px; max-width: 90%;
        }
        .auth-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ffb6c1; text-align: center; margin-bottom: 15px; }
        .auth-box button { background: #ff69b4; color: white; border: none; padding: 10px 20px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }

        #main-content { display: none; max-width: 600px; width: 100%; text-align: center; z-index: 10; padding-bottom: 50px; }
        .names-header { font-size: 28px; font-weight: bold; color: #d63384; margin-bottom: 5px; }
        .daughter-name { font-size: 24px; color: #5d001e; margin-bottom: 20px; }

        .heart-shape {
            width: 150px; height: 135px; background: #ff69b4;
            position: relative; margin: 20px auto; transform: rotate(-45deg);
            display: flex; justify-content: center; align-items: center;
        }
        .heart-shape::before, .heart-shape::after {
            content: ""; width: 150px; height: 150px; background: #ff69b4;
            border-radius: 50%; position: absolute;
        }
        .heart-shape::before { top: -75px; left: 0; }
        .heart-shape::after { left: 75px; top: 0; }
        .heart-text { transform: rotate(45deg); color: white; font-weight: bold; font-size: 16px; z-index: 10; width: 120px; }

        .counter-container { background: rgba(255, 255, 255, 0.7); border-radius: 20px; padding: 15px; margin: 20px 0; border: 1px solid #ffb6c1; }
        .counter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .time-box { background: #ff69b4; padding: 10px; border-radius: 10px; color: white; }
        .time-box span { display: block; font-size: 20px; font-weight: bold; }

        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 15px; border: 2px solid #fff; }
        .gallery img:nth-child(7) { grid-column: span 2; }

        .footer-note { margin-top: 30px; font-size: 18px; color: #d63384; font-weight: bold; }
        .i-love-you { margin-top: 15px; font-size: 14px; color: #5d001e; line-height: 1.8; }
        .floating-heart { position: absolute; color: #ff69b4; font-size: 20px; animation: floatUp 4s linear infinite; z-index: 1; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>أدخل كلمة المرور ❤️</h2>
            <input type="password" id="pass-input" placeholder="كلمة المرور">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <div id="main-content">
        <div class="names-header">محمود & نضوه</div>
        <div class="daughter-name">ليال</div>

        <div class="heart-shape"><div class="heart-text">في انتظار حبيبة بابا ليال</div></div>

        <div class="counter-container">
            <div class="counter-grid">
                <div class="time-box"><span id="days-count">0</span><label>يوماً</label></div>
                <div class="time-box"><span id="hours-count">0</span><label>ساعة</label></div>
            </div>
        </div>

        <div class="gallery">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0018.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0019.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0020.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0021.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0023.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0024.jpg" alt="ذكريات">
            <img src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/IMG-20260818-WA0025.jpg" alt="ذكريات">
        </div>

        <div class="footer-note">كل سنة وأنتِ منورة حياتي يا حياتي ❤️</div>
        <div class="i-love-you">
            بحبك: (عربي: بحبك - English: I love you - Français: Je t'aime - Türkçe: Seni seviyorum - 한국어: 사랑해요 - 中文: 我爱你)
        </div>
    </div>

    <audio id="bg-music" loop><source src="https://raw.githubusercontent.com/kjjgyfyg-bot/anniversary-gift/main/%D8%B3%D8%B1%D9%83%20%D8%A7%D9%8A%D9%87.mp3" type="audio/mp3"></audio>

    <script>
        function checkPassword() {
            if (document.getElementById('pass-input').value === '1892025') {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('bg-music').play().catch(() => {});
                startCounter(); startHearts();
            } else { alert('كلمة المرور غير صحيحة!'); }
        }
        function startCounter() {
            const diff = new Date() - new Date('2025-09-18T00:00:00');
            document.getElementById('days-count').innerText = Math.floor(diff / 86400000);
            document.getElementById('hours-count').innerText = Math.floor((diff % 86400000) / 3600000);
        }
        function startHearts() {
            setInterval(() => {
                const h = document.createElement('div'); h.classList.add('floating-heart'); h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw'; document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 500);
        }
    </script>
</body>
</html>
